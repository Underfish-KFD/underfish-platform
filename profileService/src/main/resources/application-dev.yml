spring:
  docker:
    compose:
      enabled: false
      file: ./docker-compose-dev.yml

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5438}/${DB_NAME:profile_db}
    username: ${DB_USERNAME:profile_user}
    password: ${DB_PASSWORD:profile_pass}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

