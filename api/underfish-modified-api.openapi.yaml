openapi: 3.0.3
info:
    title: Underfish Platform API
    description: |
        Полная OpenAPI 3.0 спецификация публичных и внутренних HTTP ручек Underfish Platform,
        собранная по контроллерам authService, profileService, communityService, eventService,
        locationService, fileStorageService, gateway routes и notification endpoints из legacy underfish.

        Основной публичный вход — gateway `http://localhost:8080`. Профили публично доступны как
        `/api/v1/users/{user_id}`; gateway переписывает этот путь в profileService на
        `/api/v1/profiles/{user_id}`. Внутренние сервисные URL оставлены в `servers` для локальной
        отладки прямых сервисных вызовов.
    version: 2.0.0
servers:
    - url: http://localhost:8080
      description: Local API Gateway
    - url: https://underfish.ru
      description: Production API Gateway
    - url: http://localhost:8091
      description: Auth Service direct
    - url: http://localhost:8082
      description: Profile Service direct
    - url: http://localhost:8084
      description: Community Service direct
    - url: http://localhost:8083
      description: Event Service direct
    - url: http://localhost:8081
      description: Location Service direct
    - url: http://localhost:8085
      description: File Storage Service direct

tags:
    - name: Auth
      description: Регистрация, вход, refresh token и JWKS.
    - name: Profile
      description: Публичные profile endpoints через gateway route `/api/v1/users/**`.
    - name: Profile Internal
      description: Прямые внутренние profileService endpoints `/api/v1/profiles/**`.
    - name: Communities
      description: Сообщества, участники и организаторы.
    - name: Events
      description: Мероприятия, поиск, теги, посещаемость и отзывы.
    - name: Tags
      description: Справочник тегов eventService.
    - name: Locations
      description: Геолокации locationService.
    - name: Files
      description: Загрузка и чтение метаданных файлов fileStorageService.
    - name: Notifications
      description: Уведомления legacy underfish service, прокинутые gateway routes.

paths:
    /.well-known/jwks.json:
        get:
            tags: [Auth]
            summary: Получить JWKS для проверки JWT
            operationId: getJwks
            responses:
                '200':
                    description: JSON Web Key Set с RSA public key
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/JwksResponse'

    /api/v1/users/register:
        post:
            tags: [Auth]
            summary: Зарегистрировать пользователя
            operationId: registerUser
            description: Создаёт auth-пользователя, создаёт профиль с тем же числовым ID и возвращает пару access/refresh tokens.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AuthRegisterRequest'
                        examples:
                            default:
                                value:
                                    email: test@example.com
                                    password: P@ssw0rd123
                                    name: Test User
            responses:
                '201':
                    description: Пользователь зарегистрирован
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TokenResponse'
                '400': { $ref: '#/components/responses/BadRequest' }
                '409': { $ref: '#/components/responses/Conflict' }

    /api/v1/users/login:
        post:
            tags: [Auth]
            summary: Войти по email и паролю
            operationId: loginUser
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/LoginRequest'
            responses:
                '200':
                    description: Новая пара токенов
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TokenResponse'
                '401': { $ref: '#/components/responses/Unauthorized' }

    /api/v1/tokens/refresh:
        post:
            tags: [Auth]
            summary: Обновить access/refresh tokens
            operationId: refreshTokens
            description: Принимает refresh token. Поле `refreshToken` поддерживается как legacy alias для `refresh_token`.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RefreshTokenRequest'
                        examples:
                            snake_case:
                                value:
                                    refresh_token: eyJhbGciOiJSUzI1NiJ9...
                            camelCaseAlias:
                                value:
                                    refreshToken: eyJhbGciOiJSUzI1NiJ9...
            responses:
                '200':
                    description: Новая пара токенов
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TokenResponse'
                '401': { $ref: '#/components/responses/Unauthorized' }

    /api/v1/users/{user_id}:
        get:
            tags: [Profile]
            summary: Получить профиль пользователя через gateway
            operationId: getGatewayUserProfile
            security: [{ bearerAuth: [] }]
            parameters:
                - $ref: '#/components/parameters/NumericUserId'
            responses:
                '200':
                    description: Профиль пользователя
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ProfileUserResponse'
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }
        put:
            tags: [Profile]
            summary: Обновить профиль пользователя через gateway
            operationId: updateGatewayUserProfile
            security: [{ bearerAuth: [] }]
            parameters:
                - $ref: '#/components/parameters/NumericUserId'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ProfileUpdateRequest'
            responses:
                '200':
                    description: Профиль обновлён
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ProfileUserResponse'
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }
        delete:
            tags: [Profile]
            summary: Удалить профиль пользователя через gateway
            operationId: deleteGatewayUserProfile
            security: [{ bearerAuth: [] }]
            parameters:
                - $ref: '#/components/parameters/NumericUserId'
            responses:
                '204': { description: Профиль удалён }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }

    /api/v1/profiles/register:
        put:
            tags: [Profile Internal]
            summary: Создать профиль напрямую во profileService
            operationId: registerProfileInternal
            description: Внутренняя ручка, доступная администратору/gateway. Поддерживает preallocated `user_id`.
            security: [{ bearerAuth: [] }]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ProfileRegistrationRequest'
            responses:
                '201':
                    description: Профиль создан
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ProfileUserResponse'
                '403': { $ref: '#/components/responses/Forbidden' }
                '409': { $ref: '#/components/responses/Conflict' }

    /api/v1/profiles/{user_id}:
        get:
            tags: [Profile Internal]
            summary: Получить профиль напрямую во profileService
            operationId: getProfileInternal
            security: [{ bearerAuth: [] }]
            parameters:
                - $ref: '#/components/parameters/NumericUserId'
            responses:
                '200':
                    description: Профиль пользователя
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ProfileUserResponse'
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }
        put:
            tags: [Profile Internal]
            summary: Обновить профиль напрямую во profileService
            operationId: updateProfileInternal
            security: [{ bearerAuth: [] }]
            parameters:
                - $ref: '#/components/parameters/NumericUserId'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ProfileUpdateRequest'
            responses:
                '200':
                    description: Профиль обновлён
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ProfileUserResponse'
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }
        delete:
            tags: [Profile Internal]
            summary: Удалить профиль напрямую во profileService
            operationId: deleteProfileInternal
            security: [{ bearerAuth: [] }]
            parameters:
                - $ref: '#/components/parameters/NumericUserId'
            responses:
                '204': { description: Профиль удалён }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }

    /api/v1/communities:
        post:
            tags: [Communities]
            summary: Создать сообщество
            operationId: createCommunity
            security: [{ bearerAuth: [] }]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CommunityRequest'
            responses:
                '201':
                    description: Сообщество создано
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CommunityResponse'
                '401': { $ref: '#/components/responses/Unauthorized' }
                '403': { $ref: '#/components/responses/Forbidden' }
        get:
            tags: [Communities]
            summary: Получить список сообществ
            operationId: listCommunities
            parameters:
                - name: name
                  in: query
                  schema: { type: string }
                  description: Поиск по названию.
                - name: is_private
                  in: query
                  schema: { type: boolean }
                - name: tag_ids
                  in: query
                  description: Принимается для совместимости API, текущая версия communityService не использует фильтр.
                  style: form
                  explode: true
                  schema:
                      type: array
                      items: { type: string, format: uuid }
                - $ref: '#/components/parameters/Page'
                - $ref: '#/components/parameters/Size20'
                - name: sort
                  in: query
                  schema:
                      type: string
                      default: created_at
                      enum: [created_at, updated_at, name, status]
                - name: sort_direction
                  in: query
                  schema:
                      type: string
                      default: desc
                      enum: [asc, desc]
            responses:
                '200':
                    description: Страница сообществ
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CommunityPageResponse'

    /api/v1/communities/{community_id}:
        parameters:
            - $ref: '#/components/parameters/CommunityId'
        get:
            tags: [Communities]
            summary: Получить сообщество по ID
            operationId: getCommunity
            responses:
                '200':
                    description: Сообщество
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CommunityResponse'
                '404': { $ref: '#/components/responses/NotFound' }
        put:
            tags: [Communities]
            summary: Обновить сообщество
            operationId: updateCommunity
            security: [{ bearerAuth: [] }]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CommunityRequest'
            responses:
                '200':
                    description: Сообщество обновлено
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CommunityResponse'
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }
        delete:
            tags: [Communities]
            summary: Удалить сообщество
            operationId: deleteCommunity
            security: [{ bearerAuth: [] }]
            responses:
                '204': { description: Сообщество удалено }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }

    /api/v1/communities/{community_id}/members:
        parameters:
            - $ref: '#/components/parameters/CommunityId'
        post:
            tags: [Communities]
            summary: Добавить участника сообщества
            operationId: addCommunityMember
            security: [{ bearerAuth: [] }]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CommunityMemberRequest'
            responses:
                '201':
                    description: Участник добавлен
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CommunityMemberResponse'
                '403': { $ref: '#/components/responses/Forbidden' }
        get:
            tags: [Communities]
            summary: Получить участников сообщества
            operationId: listCommunityMembers
            responses:
                '200':
                    description: Список участников
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/CommunityMemberResponse'

    /api/v1/communities/{community_id}/members/{user_id}:
        delete:
            tags: [Communities]
            summary: Удалить участника сообщества
            operationId: removeCommunityMember
            security: [{ bearerAuth: [] }]
            parameters:
                - $ref: '#/components/parameters/CommunityId'
                - $ref: '#/components/parameters/UuidUserId'
            responses:
                '204': { description: Участник удалён }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }

    /api/v1/communities/{community_id}/organizers:
        post:
            tags: [Communities]
            summary: Добавить организатора сообщества
            operationId: addCommunityOrganizer
            security: [{ bearerAuth: [] }]
            parameters:
                - $ref: '#/components/parameters/CommunityId'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CommunityOrganizerRequest'
            responses:
                '201':
                    description: Организатор добавлен
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CommunityOrganizerResponse'
                '403': { $ref: '#/components/responses/Forbidden' }

    /api/v1/communities/{community_id}/organizers/{user_id}:
        delete:
            tags: [Communities]
            summary: Удалить организатора сообщества
            operationId: removeCommunityOrganizer
            security: [{ bearerAuth: [] }]
            parameters:
                - $ref: '#/components/parameters/CommunityId'
                - $ref: '#/components/parameters/UuidUserId'
            responses:
                '204': { description: Организатор удалён }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }

    /api/v1/events:
        post:
            tags: [Events]
            summary: Создать мероприятие
            operationId: createEvent
            security: [{ bearerAuth: [] }]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/EventRequest'
                        examples:
                            default:
                                value:
                                    title: E2E Event
                                    description: Event created by integration test
                                    start_datetime: '2030-01-01T10:00:00'
                                    end_datetime: '2030-01-01T12:00:00'
                                    location_id: '1'
                                    price: 0
                                    currency: RUB
                                    community_id: 72bb6a64-fd1b-4a7e-9649-80f91b261596
                                    status: PUBLISHED
                                    max_participants: 10
                                    is_online: true
            responses:
                '201':
                    description: Мероприятие создано
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/EventResponse'
                '400': { $ref: '#/components/responses/BadRequest' }
                '401': { $ref: '#/components/responses/Unauthorized' }
        get:
            tags: [Events]
            summary: Найти мероприятия
            operationId: listEvents
            parameters:
                - name: title
                  in: query
                  schema: { type: string }
                - name: status
                  in: query
                  schema:
                      type: string
                      enum: [DRAFT, PUBLISHED, CANCELLED, COMPLETED]
                - name: is_online
                  in: query
                  schema: { type: boolean }
                - name: start_from
                  in: query
                  schema: { type: string, format: date-time }
                - name: start_to
                  in: query
                  schema: { type: string, format: date-time }
                - name: price_min
                  in: query
                  schema: { type: number, format: double }
                - name: price_max
                  in: query
                  schema: { type: number, format: double }
                - name: location_id
                  in: query
                  description: Внешний ID локации. Сейчас хранится строкой и может быть числовым значением вида `1`.
                  schema: { type: string, example: '1' }
                - name: tag_ids
                  in: query
                  style: form
                  explode: true
                  schema:
                      type: array
                      items: { type: string, format: uuid }
                - name: community_id
                  in: query
                  schema: { type: string, format: uuid }
                - name: organizer_id
                  in: query
                  schema: { type: string, format: uuid }
                - $ref: '#/components/parameters/Page'
                - $ref: '#/components/parameters/Size20'
                - name: sort
                  in: query
                  schema:
                      type: string
                      default: startDatetime
                - name: sort_direction
                  in: query
                  schema:
                      type: string
                      default: asc
                      enum: [asc, desc]
            responses:
                '200':
                    description: Страница мероприятий
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/EventPageResponse'

    /api/v1/events/{event_id}:
        parameters:
            - $ref: '#/components/parameters/EventId'
        get:
            tags: [Events]
            summary: Получить мероприятие по ID
            operationId: getEvent
            responses:
                '200':
                    description: Мероприятие
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/EventResponse'
                '404': { $ref: '#/components/responses/NotFound' }
        put:
            tags: [Events]
            summary: Обновить мероприятие
            operationId: updateEvent
            security: [{ bearerAuth: [] }]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/EventRequest'
            responses:
                '200':
                    description: Мероприятие обновлено
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/EventResponse'
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }
        delete:
            tags: [Events]
            summary: Удалить мероприятие
            operationId: deleteEvent
            security: [{ bearerAuth: [] }]
            responses:
                '204': { description: Мероприятие удалено }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }

    /api/v1/events/{event_id}/tags:
        parameters:
            - $ref: '#/components/parameters/EventId'
        post:
            tags: [Events]
            summary: Привязать тег к мероприятию
            operationId: addTagToEvent
            security: [{ bearerAuth: [] }]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/EventTagRequest'
            responses:
                '201':
                    description: Тег привязан
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/EventTagResponse'
        get:
            tags: [Events]
            summary: Получить теги мероприятия
            operationId: listEventTags
            responses:
                '200':
                    description: Список тегов мероприятия
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/EventTagResponse'

    /api/v1/events/{event_id}/tags/{tag_id}:
        delete:
            tags: [Events]
            summary: Отвязать тег от мероприятия
            operationId: removeTagFromEvent
            security: [{ bearerAuth: [] }]
            parameters:
                - $ref: '#/components/parameters/EventId'
                - $ref: '#/components/parameters/TagId'
            responses:
                '204': { description: Тег отвязан }
                '404': { $ref: '#/components/responses/NotFound' }

    /api/v1/events/{event_id}/attendance:
        parameters:
            - $ref: '#/components/parameters/EventId'
        post:
            tags: [Events]
            summary: Добавить посещаемость текущего пользователя
            operationId: addEventAttendance
            security: [{ bearerAuth: [] }]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/EventAttendanceRequest'
            responses:
                '201':
                    description: Посещаемость добавлена
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/EventAttendanceResponse'
        get:
            tags: [Events]
            summary: Получить посещаемость мероприятия
            operationId: listEventAttendance
            parameters:
                - name: status
                  in: query
                  schema:
                      type: string
                      enum: [PENDING, CONFIRMED, CANCELLED, ATTENDED]
                - $ref: '#/components/parameters/Page'
                - $ref: '#/components/parameters/Size20'
            responses:
                '200':
                    description: Список записей посещаемости
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/EventAttendanceResponse'

    /api/v1/events/{event_id}/attendance/{user_id}:
        put:
            tags: [Events]
            summary: Обновить статус посещаемости пользователя
            operationId: updateEventAttendance
            security: [{ bearerAuth: [] }]
            parameters:
                - $ref: '#/components/parameters/EventId'
                - $ref: '#/components/parameters/UuidUserId'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/EventAttendanceUpdateRequest'
            responses:
                '200':
                    description: Посещаемость обновлена
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/EventAttendanceResponse'
        delete:
            tags: [Events]
            summary: Удалить посещаемость пользователя
            operationId: removeEventAttendance
            security: [{ bearerAuth: [] }]
            parameters:
                - $ref: '#/components/parameters/EventId'
                - $ref: '#/components/parameters/UuidUserId'
            responses:
                '204': { description: Посещаемость удалена }
                '404': { $ref: '#/components/responses/NotFound' }

    /api/v1/events/{event_id}/reviews:
        parameters:
            - $ref: '#/components/parameters/EventId'
        post:
            tags: [Events]
            summary: Создать отзыв о мероприятии
            operationId: createEventReview
            security: [{ bearerAuth: [] }]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ReviewRequest'
            responses:
                '201':
                    description: Отзыв создан
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ReviewResponse'
        get:
            tags: [Events]
            summary: Получить отзывы мероприятия
            operationId: listEventReviews
            responses:
                '200':
                    description: Список отзывов
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/ReviewResponse'

    /api/v1/reviews/{review_id}:
        delete:
            tags: [Events]
            summary: Удалить отзыв
            operationId: deleteReview
            security: [{ bearerAuth: [] }]
            parameters:
                - $ref: '#/components/parameters/ReviewId'
            responses:
                '204': { description: Отзыв удалён }
                '404': { $ref: '#/components/responses/NotFound' }

    /api/v1/tags:
        post:
            tags: [Tags]
            summary: Создать тег
            operationId: createTag
            description: JSON тело декодируется как UTF-8; при ошибке UTF-8 eventService пробует legacy windows-1251 fallback.
            security: [{ bearerAuth: [] }]
            requestBody:
                required: true
                content:
                    application/json; charset=utf-8:
                        schema:
                            $ref: '#/components/schemas/TagRequest'
                        examples:
                            cyrillic:
                                value: { name: музыка }
                    application/json; charset=windows-1251:
                        schema:
                            $ref: '#/components/schemas/TagRequest'
            responses:
                '201':
                    description: Тег создан
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TagResponse'
                '400': { $ref: '#/components/responses/BadRequest' }
                '409': { $ref: '#/components/responses/Conflict' }
        get:
            tags: [Tags]
            summary: Получить список тегов
            operationId: listTags
            parameters:
                - $ref: '#/components/parameters/Page'
                - $ref: '#/components/parameters/Size50'
            responses:
                '200':
                    description: Список тегов
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/TagResponse'

    /api/v1/tags/{tag_id}:
        parameters:
            - $ref: '#/components/parameters/TagId'
        get:
            tags: [Tags]
            summary: Получить тег по ID
            operationId: getTag
            responses:
                '200':
                    description: Тег
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TagResponse'
                '404': { $ref: '#/components/responses/NotFound' }
        put:
            tags: [Tags]
            summary: Обновить тег
            operationId: updateTag
            security: [{ bearerAuth: [] }]
            requestBody:
                required: true
                content:
                    application/json; charset=utf-8:
                        schema:
                            $ref: '#/components/schemas/TagRequest'
                    application/json; charset=windows-1251:
                        schema:
                            $ref: '#/components/schemas/TagRequest'
            responses:
                '200':
                    description: Тег обновлён
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TagResponse'
                '400': { $ref: '#/components/responses/BadRequest' }
                '404': { $ref: '#/components/responses/NotFound' }
                '409': { $ref: '#/components/responses/Conflict' }
        delete:
            tags: [Tags]
            summary: Удалить тег
            operationId: deleteTag
            security: [{ bearerAuth: [] }]
            responses:
                '204': { description: Тег удалён }
                '404': { $ref: '#/components/responses/NotFound' }

    /api/v1/locations:
        post:
            tags: [Locations]
            summary: Создать геолокацию
            operationId: createLocation
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/LocationRequest'
            responses:
                '200':
                    description: Геолокация создана
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/LocationResponse'
                '400': { $ref: '#/components/responses/BadRequest' }

    /api/v1/locations/{locationId}:
        parameters:
            - $ref: '#/components/parameters/LocationIdCamel'
        get:
            tags: [Locations]
            summary: Получить геолокацию по ID
            operationId: getLocation
            responses:
                '200':
                    description: Геолокация
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/LocationResponse'
                '404': { $ref: '#/components/responses/NotFound' }
        put:
            tags: [Locations]
            summary: Обновить геолокацию
            operationId: updateLocation
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/LocationRequest'
            responses:
                '200':
                    description: Геолокация обновлена
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/LocationResponse'
                '404': { $ref: '#/components/responses/NotFound' }
        delete:
            tags: [Locations]
            summary: Удалить геолокацию
            operationId: deleteLocation
            responses:
                '204': { description: Геолокация удалена }
                '404': { $ref: '#/components/responses/NotFound' }

    /api/v1/files/upload:
        post:
            tags: [Files]
            summary: Загрузить файл
            operationId: uploadFile
            requestBody:
                required: true
                content:
                    multipart/form-data:
                        schema:
                            type: object
                            required: [file]
                            properties:
                                file:
                                    type: string
                                    format: binary
            responses:
                '201':
                    description: Файл загружен, метаданные сохранены
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StoredFileResponse'
                '400': { $ref: '#/components/responses/BadRequest' }

    /api/v1/files/{id}:
        get:
            tags: [Files]
            summary: Получить метаданные файла по ID
            operationId: getFileMetadata
            parameters:
                - name: id
                  in: path
                  required: true
                  schema: { type: string, format: uuid }
            responses:
                '200':
                    description: Метаданные файла
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StoredFileResponse'
                '404': { $ref: '#/components/responses/NotFound' }

    /api/v1/users/{user_id}/notifications:
        get:
            tags: [Notifications]
            summary: Получить уведомления пользователя
            operationId: listUserNotifications
            security: [{ bearerAuth: [] }]
            parameters:
                - $ref: '#/components/parameters/NumericUserId'
            responses:
                '200':
                    description: Список уведомлений
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/NotificationResponse'

    /api/v1/notifications/{notification_id}/read:
        put:
            tags: [Notifications]
            summary: Пометить уведомление прочитанным
            operationId: markNotificationRead
            security: [{ bearerAuth: [] }]
            parameters:
                - $ref: '#/components/parameters/NotificationId'
            responses:
                '200':
                    description: Уведомление обновлено
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/NotificationResponse'
                '404': { $ref: '#/components/responses/NotFound' }
        delete:
            tags: [Notifications]
            summary: Удалить уведомление
            operationId: deleteNotification
            security: [{ bearerAuth: [] }]
            parameters:
                - $ref: '#/components/parameters/NotificationId'
            responses:
                '204': { description: Уведомление удалено }
                '404': { $ref: '#/components/responses/NotFound' }

components:
    securitySchemes:
        bearerAuth:
            type: http
            scheme: bearer
            bearerFormat: JWT

    parameters:
        NumericUserId:
            name: user_id
            in: path
            required: true
            description: Числовой ID пользователя auth/profile.
            schema: { type: integer, format: int64, example: 1 }
        UuidUserId:
            name: user_id
            in: path
            required: true
            description: UUID пользователя в community/event доменах.
            schema: { type: string, format: uuid }
        CommunityId:
            name: community_id
            in: path
            required: true
            schema: { type: string, format: uuid }
        EventId:
            name: event_id
            in: path
            required: true
            schema: { type: string, format: uuid }
        TagId:
            name: tag_id
            in: path
            required: true
            schema: { type: string, format: uuid }
        ReviewId:
            name: review_id
            in: path
            required: true
            schema: { type: string, format: uuid }
        NotificationId:
            name: notification_id
            in: path
            required: true
            schema: { type: integer, format: int64 }
        LocationIdCamel:
            name: locationId
            in: path
            required: true
            schema: { type: integer, format: int64, example: 1 }
        Page:
            name: page
            in: query
            schema: { type: integer, minimum: 0, default: 0 }
        Size20:
            name: size
            in: query
            schema: { type: integer, minimum: 1, default: 20 }
        Size50:
            name: size
            in: query
            schema: { type: integer, minimum: 1, default: 50 }

    responses:
        BadRequest:
            description: Некорректный запрос
            content:
                application/json:
                    schema: { $ref: '#/components/schemas/ErrorResponse' }
        Unauthorized:
            description: Требуется авторизация или токен невалиден
            content:
                application/json:
                    schema: { $ref: '#/components/schemas/ErrorResponse' }
        Forbidden:
            description: Недостаточно прав
            content:
                application/json:
                    schema: { $ref: '#/components/schemas/ErrorResponse' }
        NotFound:
            description: Ресурс не найден
            content:
                application/json:
                    schema: { $ref: '#/components/schemas/ErrorResponse' }
        Conflict:
            description: Конфликт состояния или дубликат
            content:
                application/json:
                    schema: { $ref: '#/components/schemas/ErrorResponse' }

    schemas:
        AuthRegisterRequest:
            type: object
            required: [email, password]
            properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 1 }
                name:
                    type: string
                    nullable: true
                    description: Имя профиля; если пустое, используется часть email до `@`.

        LoginRequest:
            type: object
            required: [email, password]
            properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 1 }

        RefreshTokenRequest:
            type: object
            properties:
                refresh_token:
                    type: string
                    description: Основное wire-поле при включённом SNAKE_CASE.
                refreshToken:
                    type: string
                    deprecated: true
                    description: Legacy alias, принимаемый `@JsonAlias("refreshToken")`.
            anyOf:
                - required: [refresh_token]
                - required: [refreshToken]

        TokenResponse:
            type: object
            required: [token, access_token, refresh_token, token_type, expires_in]
            properties:
                token:
                    type: string
                    description: Backward-compatible alias для `access_token`.
                access_token: { type: string }
                refresh_token: { type: string }
                token_type: { type: string, example: Bearer }
                expires_in:
                    type: integer
                    format: int64
                    description: TTL access token в секундах.

        JwksResponse:
            type: object
            required: [keys]
            properties:
                keys:
                    type: array
                    items:
                        type: object
                        required: [kty, use, kid, alg, n, e]
                        properties:
                            kty: { type: string, example: RSA }
                            use: { type: string, example: sig }
                            kid: { type: string }
                            alg: { type: string, example: RS256 }
                            n: { type: string }
                            e: { type: string }

        ProfileRegistrationRequest:
            type: object
            required: [email, password]
            properties:
                user_id:
                    type: integer
                    format: int64
                    nullable: true
                    description: Optional preallocated auth user ID.
                email: { type: string, format: email }
                password: { type: string }
                first_name: { type: string, nullable: true }
                last_name: { type: string, nullable: true }
                phone: { type: string, nullable: true }

        ProfileUpdateRequest:
            type: object
            properties:
                first_name: { type: string, nullable: true }
                last_name: { type: string, nullable: true }
                phone: { type: string, nullable: true }
                avatar_url: { type: string, nullable: true }

        ProfileUserResponse:
            type: object
            required: [user_id, email, first_name, last_name, registration_date]
            properties:
                user_id:
                    type: string
                    pattern: '^\d+$'
                    example: '1'
                email: { type: string, format: email }
                first_name: { type: string }
                last_name: { type: string }
                phone: { type: string, nullable: true }
                avatar_url: { type: string, nullable: true }
                registration_date: { type: string, format: date-time }
                last_login: { type: string, format: date-time, nullable: true }

        CommunityRequest:
            type: object
            required: [name, description]
            description: communityService сейчас не задаёт SNAKE_CASE, поэтому body fields wire-format в camelCase.
            properties:
                name: { type: string }
                description: { type: string }
                isPrivate: { type: boolean, default: false }
                coverUrl: { type: string, nullable: true }

        CommunityResponse:
            type: object
            required: [communityId, name, organizerId, isPrivate, createdAt, updatedAt, status]
            properties:
                communityId: { type: string, format: uuid }
                name: { type: string }
                description: { type: string, nullable: true }
                organizerId: { type: string, format: uuid }
                isPrivate: { type: boolean }
                coverUrl: { type: string, nullable: true }
                createdAt: { type: string, format: date-time }
                updatedAt: { type: string, format: date-time }
                status: { type: string, enum: [ACTIVE, SUSPENDED, ARCHIVED] }

        CommunityPageResponse:
            type: object
            required: [content, meta]
            properties:
                content:
                    type: array
                    items: { $ref: '#/components/schemas/CommunityResponse' }
                meta: { $ref: '#/components/schemas/CommunityPageMeta' }

        CommunityPageMeta:
            type: object
            required: [page, size, totalElements, totalPages]
            properties:
                page: { type: integer }
                size: { type: integer }
                totalElements: { type: integer }
                totalPages: { type: integer }

        CommunityMemberRequest:
            type: object
            required: [userId]
            properties:
                userId: { type: string, format: uuid }
                role: { type: string, nullable: true }

        CommunityMemberResponse:
            type: object
            required: [memberId, userId, communityId, role, joinedAt]
            properties:
                memberId: { type: integer, format: int64 }
                userId: { type: string, format: uuid }
                communityId: { type: string, format: uuid }
                role: { type: string }
                joinedAt: { type: string, format: date-time }

        CommunityOrganizerRequest:
            type: object
            required: [userId]
            properties:
                userId: { type: string, format: uuid }

        CommunityOrganizerResponse:
            type: object
            required: [communityId, userId]
            properties:
                communityId: { type: string, format: uuid }
                userId: { type: string, format: uuid }

        EventRequest:
            type: object
            required: [title, description, start_datetime, end_datetime, location_id, status]
            properties:
                title: { type: string, minLength: 1 }
                description: { type: string, minLength: 1 }
                start_datetime: { type: string, format: date-time }
                end_datetime: { type: string, format: date-time }
                location_id:
                    type: string
                    description: Внешний ID locationService; хранится как текст и может быть числовой строкой.
                    example: '1'
                price: { type: number, format: double, nullable: true }
                currency: { type: string, nullable: true }
                poster_url: { type: string, nullable: true }
                community_id: { type: string, format: uuid, nullable: true }
                status: { type: string, enum: [DRAFT, PUBLISHED, CANCELLED, COMPLETED] }
                max_participants: { type: integer, nullable: true }
                is_online: { type: boolean, nullable: true }

        EventResponse:
            type: object
            required: [event_id, title, description, start_datetime, location_id, price, currency, status, created_at, updated_at, max_participants, is_online]
            properties:
                event_id: { type: string, format: uuid }
                title: { type: string }
                description: { type: string }
                start_datetime: { type: string, format: date-time }
                end_datetime: { type: string, format: date-time, nullable: true }
                location_id: { type: string, example: '1' }
                price: { type: number, format: double }
                currency: { type: string }
                poster_url: { type: string, nullable: true }
                community_id: { type: string, format: uuid, nullable: true }
                status: { type: string, enum: [DRAFT, PUBLISHED, CANCELLED, COMPLETED] }
                created_at: { type: string, format: date-time }
                updated_at: { type: string, format: date-time }
                max_participants: { type: integer }
                is_online: { type: boolean }

        EventPageResponse:
            type: object
            required: [content, meta]
            properties:
                content:
                    type: array
                    items: { $ref: '#/components/schemas/EventResponse' }
                meta: { $ref: '#/components/schemas/PageMeta' }

        EventTagRequest:
            type: object
            required: [tag_id]
            properties:
                tag_id: { type: string, format: uuid }

        EventTagResponse:
            type: object
            required: [event_id, tag_id]
            properties:
                event_id: { type: string, format: uuid }
                tag_id: { type: string, format: uuid }

        EventAttendanceRequest:
            type: object
            required: [status]
            properties:
                status: { type: string, enum: [PENDING, CONFIRMED, CANCELLED, ATTENDED] }

        EventAttendanceUpdateRequest:
            allOf:
                - $ref: '#/components/schemas/EventAttendanceRequest'

        EventAttendanceResponse:
            type: object
            required: [attendance_id, user_id, event_id, status, created_at]
            properties:
                attendance_id: { type: string, format: uuid }
                user_id: { type: string, format: uuid }
                event_id: { type: string, format: uuid }
                status: { type: string, enum: [PENDING, CONFIRMED, CANCELLED, ATTENDED] }
                created_at: { type: string, format: date-time }

        ReviewRequest:
            type: object
            required: [rating, comment]
            properties:
                rating: { type: integer, minimum: 1, maximum: 5 }
                comment: { type: string, minLength: 1 }

        ReviewResponse:
            type: object
            required: [review_id, user_id, event_id, rating, comment, created_at]
            properties:
                review_id: { type: string, format: uuid }
                user_id: { type: string, format: uuid }
                event_id: { type: string, format: uuid }
                rating: { type: integer, minimum: 1, maximum: 5 }
                comment: { type: string }
                created_at: { type: string, format: date-time }

        TagRequest:
            type: object
            required: [name]
            properties:
                name: { type: string, minLength: 1, example: музыка }

        TagResponse:
            type: object
            required: [tag_id, name]
            properties:
                tag_id: { type: string, format: uuid }
                name: { type: string }

        LocationRequest:
            type: object
            required: [latitude, longitude, timezone]
            description: locationService сейчас отдаёт/принимает camelCase поля (`placeName`, `locationId`).
            properties:
                address: { type: string, nullable: true }
                latitude: { type: number }
                longitude: { type: number }
                city: { type: string, nullable: true }
                district: { type: string, nullable: true }
                placeName: { type: string, nullable: true }
                timezone: { type: string }

        LocationResponse:
            type: object
            required: [locationId, latitude, longitude, timezone]
            properties:
                locationId: { type: string, pattern: '^\d+$', example: '1' }
                address: { type: string, nullable: true }
                latitude: { type: number }
                longitude: { type: number }
                city: { type: string, nullable: true }
                district: { type: string, nullable: true }
                placeName: { type: string, nullable: true }
                timezone: { type: string }

        StoredFileResponse:
            type: object
            required: [id, original_name, content_type, size_bytes, created_at]
            properties:
                id: { type: string, format: uuid }
                original_name: { type: string }
                content_type: { type: string }
                size_bytes: { type: integer, format: int64 }
                created_at: { type: string, format: date-time }

        NotificationResponse:
            type: object
            required: [notification_id, user_id, title, type, is_read, created_at, priority]
            properties:
                notification_id: { type: string, pattern: '^\d+$' }
                user_id: { type: string, pattern: '^\d+$' }
                title: { type: string }
                message: { type: string, nullable: true }
                type: { type: string }
                is_read: { type: boolean }
                created_at: { type: string, format: date-time }
                action_url: { type: string, nullable: true }
                priority: { type: string }
                event_id: { type: string, nullable: true }

        PageMeta:
            type: object
            required: [page, size, total_elements, total_pages]
            properties:
                page: { type: integer }
                size: { type: integer }
                total_elements: { type: integer, format: int64 }
                total_pages: { type: integer }

        ErrorResponse:
            type: object
            properties:
                timestamp: { type: string, format: date-time }
                status: { type: integer }
                error: { type: string }
                message: { type: string, nullable: true }
                path: { type: string, nullable: true }
