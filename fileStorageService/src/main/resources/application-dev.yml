spring:
  docker:
    compose:
      enabled: false
      file: ./docker-compose-infra.yml

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5437}/${DB_NAME:storage_db}
    username: ${DB_USERNAME:storage_user}
    password: ${DB_PASSWORD:storage_pass}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

