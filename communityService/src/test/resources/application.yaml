spring:
  application:
    name: communityService-test
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: false
  flyway:
    enabled: false

server:
  port: 0

gateway:
  security:
    enabled: false

auth:
  service:
    url: http://localhost:8080

logging:
  level:
    root: WARN
    ru.underfish: INFO

