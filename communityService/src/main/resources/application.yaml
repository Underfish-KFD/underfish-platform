spring:
  application:
    name: communityService
  boot:
    admin:
      client:
        enabled: false

server:
  port: ${SERVER_PORT:8084}

gateway:
  security:
    enabled: true
    public-paths:
      - /actuator/health
      - /actuator/info
    roles-delimiter: ","
    trusted-internal-token: ${GATEWAY_INTERNAL_TOKEN:}
    headers:
      user-id: X-User-Id
      user-email: X-User-Email
      user-roles: X-User-Roles
      auth-source: X-Auth-Source
      internal-token: X-Internal-Token
