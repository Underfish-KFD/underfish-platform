networks:
    underfish_net:
        driver: bridge

volumes:
    # ---------- PostgreSQL ----------
    pg_auth_data:
    pg_event_data:
    pg_geo_data:
    pg_notification_data:
    pg_community_data:
    pg_storage_data:
    pg_profile_data:
    # ---------- Redis ----------
    redis_data:
    # ---------- MinIO ----------
    minio_data:

services:

    # ===========================================================================
    #  PostgreSQL — Auth Service
    # ===========================================================================
    pg-auth:
        image: postgres:16-alpine
        container_name: uf_pg_auth
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${AUTH_DB_NAME:-auth_db}
            POSTGRES_USER: ${AUTH_DB_USER:-auth_user}
            POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-auth_pass}
        ports:
            - "${AUTH_DB_PORT:-5432}:5432"
        volumes:
            - pg_auth_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${AUTH_DB_USER:-auth_user} -d ${AUTH_DB_NAME:-auth_db}"]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - underfish_net

    # ===========================================================================
    #  PostgreSQL — Event Service
    # ===========================================================================
    pg-event:
        image: postgis/postgis:16-3.4-alpine
        container_name: uf_pg_event
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${EVENT_DB_NAME:-event_db}
            POSTGRES_USER: ${EVENT_DB_USER:-event_user}
            POSTGRES_PASSWORD: ${EVENT_DB_PASSWORD:-event_pass}
        ports:
            - "${EVENT_DB_PORT:-5433}:5432"
        volumes:
            - pg_event_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${EVENT_DB_USER:-event_user} -d ${EVENT_DB_NAME:-event_db}"]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - underfish_net

    # ===========================================================================
    #  PostgreSQL — Geo Service  (PostGIS для геозапросов)
    # ===========================================================================
    pg-geo:
        image: postgis/postgis:16-3.4-alpine
        container_name: uf_pg_geo
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${GEO_DB_NAME:-geo_db}
            POSTGRES_USER: ${GEO_DB_USER:-geo_user}
            POSTGRES_PASSWORD: ${GEO_DB_PASSWORD:-geo_pass}
        ports:
            - "${GEO_DB_PORT:-5434}:5432"
        volumes:
            - pg_geo_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${GEO_DB_USER:-geo_user} -d ${GEO_DB_NAME:-geo_db}"]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - underfish_net

    # ===========================================================================
    #  PostgreSQL — Notification Service
    # ===========================================================================
    pg-notification:
        image: postgres:16-alpine
        container_name: uf_pg_notification
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${NOTIFICATION_DB_NAME:-notification_db}
            POSTGRES_USER: ${NOTIFICATION_DB_USER:-notification_user}
            POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-notification_pass}
        ports:
            - "${NOTIFICATION_DB_PORT:-5435}:5432"
        volumes:
            - pg_notification_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${NOTIFICATION_DB_USER:-notification_user} -d ${NOTIFICATION_DB_NAME:-notification_db}"]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - underfish_net

    # ===========================================================================
    #  PostgreSQL — Community Service
    # ===========================================================================
    pg-community:
        image: postgres:16-alpine
        container_name: uf_pg_community
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${COMMUNITY_DB_NAME:-community_db}
            POSTGRES_USER: ${COMMUNITY_DB_USER:-community_user}
            POSTGRES_PASSWORD: ${COMMUNITY_DB_PASSWORD:-community_pass}
        ports:
            - "${COMMUNITY_DB_PORT:-5436}:5432"
        volumes:
            - pg_community_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${COMMUNITY_DB_USER:-community_user} -d ${COMMUNITY_DB_NAME:-community_db}"]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - underfish_net

    # ===========================================================================
    #  PostgreSQL — File Storage Service
    # ===========================================================================
    pg-storage:
        image: postgres:16-alpine
        container_name: uf_pg_storage
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${STORAGE_DB_NAME:-storage_db}
            POSTGRES_USER: ${STORAGE_DB_USER:-storage_user}
            POSTGRES_PASSWORD: ${STORAGE_DB_PASSWORD:-storage_pass}
        ports:
            - "${STORAGE_DB_PORT:-5437}:5432"
        volumes:
            - pg_storage_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${STORAGE_DB_USER:-storage_user} -d ${STORAGE_DB_NAME:-storage_db}"]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - underfish_net

    # ===========================================================================
    #  PostgreSQL — Profile Service
    # ===========================================================================
    pg-profile:
        image: postgres:16-alpine
        container_name: uf_pg_profile
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${PROFILE_DB_NAME:-profile_db}
            POSTGRES_USER: ${PROFILE_DB_USER:-profile_user}
            POSTGRES_PASSWORD: ${PROFILE_DB_PASSWORD:-profile_pass}
        ports:
            - "${PROFILE_DB_PORT:-5438}:5432"
        volumes:
            - pg_profile_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${PROFILE_DB_USER:-profile_user} -d ${PROFILE_DB_NAME:-profile_db}"]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - underfish_net

    # ===========================================================================
    #  Redis  (общий кэш и хранение сессий/JWT для всех сервисов)
    # ===========================================================================
    redis:
        image: redis:7-alpine
        container_name: uf_redis
        restart: unless-stopped
        command: >
            redis-server
            --requirepass ${REDIS_PASSWORD:-redispass}
            --maxmemory 256mb
            --maxmemory-policy allkeys-lru
        ports:
            - "${REDIS_PORT:-6379}:6379"
        volumes:
            - redis_data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redispass}", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - underfish_net

    # ===========================================================================
    #  Zipkin  (распределённая трассировка запросов между сервисами)
    # ===========================================================================
    zipkin:
        image: openzipkin/zipkin:latest
        container_name: uf_zipkin
        restart: unless-stopped
        ports:
            - "${ZIPKIN_PORT:-9411}:9411"
        healthcheck:
            test: ["CMD-SHELL", "curl -f http://localhost:9411/health || exit 1"]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - underfish_net

    # ===========================================================================
    #  MinIO  (объектное хранилище для File Storage Service)
    # ===========================================================================
    minio:
        image: minio/minio:latest
        container_name: uf_minio
        restart: unless-stopped
        command: server /data --console-address ":9001"
        environment:
            MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
            MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
        ports:
            - "${MINIO_PORT:-9000}:9000"
            - "${MINIO_CONSOLE_PORT:-9001}:9001"
        volumes:
            - minio_data:/data
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - underfish_net

    # ===========================================================================
    #  MinIO init — создаёт бакет при первом запуске
    # ===========================================================================
    minio-init:
        image: minio/mc:latest
        container_name: uf_minio_init
        depends_on:
            minio:
                condition: service_healthy
        environment:
            MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
            MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
            MINIO_BUCKET: ${MINIO_BUCKET:-underfish-files}
        entrypoint: >
            /bin/sh -c "
              mc alias set local http://minio:9000 $$MINIO_ACCESS_KEY $$MINIO_SECRET_KEY &&
              mc mb --ignore-existing local/$$MINIO_BUCKET &&
              mc anonymous set download local/$$MINIO_BUCKET &&
              echo 'Bucket $$MINIO_BUCKET is ready.'
            "
        restart: on-failure
        networks:
            - underfish_net
